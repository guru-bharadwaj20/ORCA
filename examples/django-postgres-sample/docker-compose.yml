name: orca-django-sample

services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "orca"
      POSTGRES_USER: "orca"
      POSTGRES_PASSWORD: "orca"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - orca-django-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_DB: "orca"
      POSTGRES_USER: "orca"
      POSTGRES_PASSWORD: "orca"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
    depends_on:
      - db
    volumes:
      - ".:/app"
    networks:
      - orca-django-net

networks:
  orca-django-net:
    driver: bridge

volumes:
  postgres-data:
