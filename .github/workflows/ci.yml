name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to no access; this workflow only reads the checked-out code and doesn't need
# to write anything back (no PR comments, no releases). Least-privilege default for a
# workflow that also runs on pull_request (including from forks).
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the `engines` floor, upper bound is current LTS. Node 20 was
        # dropped at its April 2026 EOL: execa, chalk and commander all now require >=22,
        # and the failure is an import-time crash, not a soft degradation.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build core (tsc + template packaging)
        run: npm run build

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test core
        run: npm test

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Smoke test the compiled CLI
        run: node ./dist/cli/index.js run examples/mern-sample --dry-run --auto-approve

      - name: Smoke test a repo with no database
        run: node ./dist/cli/index.js run tests/fixtures/react-express-nodb-repo --dry-run --auto-approve

      - name: Package the VS Code extension
        run: npm run package -w orca-vscode
