name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build core (tsc + template packaging)
        run: npm run build

      - name: Build workspaces
        run: npm run build --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test core
        run: npm test

      - name: Test workspaces
        run: npm run test --workspaces --if-present

      - name: Smoke test the compiled CLI
        run: node ./dist/cli/index.js run examples/mern-sample --dry-run --auto-approve

      - name: Package the VS Code extension
        run: npm run package -w orca-vscode
