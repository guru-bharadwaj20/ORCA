name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (tsc + template packaging)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Hermetic by design: no API keys, no docker — AI providers are mocked and the
      # keyless path is first-class, so the full suite runs anywhere.
      - name: Test
        run: npm test

      # Prove the packaged CLI actually runs end-to-end (dry run needs no docker/keys).
      - name: Smoke test the compiled CLI
        run: node ./dist/cli/index.js run examples/mern-sample --dry-run --auto-approve
